<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - السراج المنير</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon" style="background: none; color: #f1c40f; font-size: 32px; width: 64px; height: 64px; margin: 0 auto 10px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2h4"/>
            <path d="M12 2v4"/>
            <path d="M8 22h8"/>
            <path d="M12 22v-4"/>
            <path d="M6.3 12c0-3.3 2.5-6 5.7-6h0c3.2 0 5.7 2.7 5.7 6 0 1.9-1 3.5-2.3 4.5l-.7.5V18h-6v-1l-.7-.5C6.7 15.5 6.3 13.9 6.3 12z"/>
            <path d="M9.5 12a2.5 2.5 0 0 1 5 0"/>
          </svg>
        </div>
        <h1>السراج المنير</h1>
        <p>بيع وشراء الدولار مقابل الدينار العراقي</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="./index_inline_1.js"></script>
</body>
</html>
