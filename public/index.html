<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - نظام إدارة الصيرفة</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">ص</div>
        <h1>نظام إدارة مكتب الصيرفة</h1>
        <p>بيع وشراء الدولار مقابل الدينار العراقي</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="./index_inline_1.js"></script>
</body>
</html>
