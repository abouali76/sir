<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - نظام إدارة الصيرفة</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">ص</div>
        <h1>نظام إدارة مكتب الصيرفة</h1>
        <p>بيع وشراء الدولار مقابل الدينار العراقي</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    // إذا كان المستخدم مسجل دخوله مسبقًا، انتقل مباشرة للوحة التحكم
    api.get('/auth/me').then(() => {
      window.location.href = '/pages/dashboard.html';
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'جاري الدخول...';

      try {
        await api.post('/auth/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        });
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message || 'حدث خطأ أثناء تسجيل الدخول';
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
